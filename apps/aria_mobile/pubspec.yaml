name: aria_mobile
description: Aria native companion app (Flutter) — calls Laravel /api/mobile/v1.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  mobile_scanner: ^5.2.3
  permission_handler: ^11.3.1
  intl: ^0.19.0
  uuid: ^4.5.1
  printing: ^5.13.4
  url_launcher: ^6.3.1
  print_bluetooth_thermal: ^1.2.5
  esc_pos_utils_plus: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
