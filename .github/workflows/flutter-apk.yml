name: Flutter debug APK

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Optional API base URL baked into the APK (no trailing slash). Overrides repo variable ARIA_MOBILE_BASE_URL.'
        required: false
        type: string
  push:
    branches:
      - main
      - develop
      - master
    paths:
      - 'apps/aria_mobile/**'
      - '.github/workflows/flutter-apk.yml'

# Debug APK for sideloading — team debug keystore + monotonic versionCode (GITHUB_RUN_NUMBER).
jobs:
  apk:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable

    defaults:
      run:
        working-directory: apps/aria_mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate Android project
        run: flutter create --org com.ariantog --project-name aria_mobile --platforms=android .

      - name: Apply Android overlays
        run: bash tool/apply_android_overlay.sh

      - name: Build debug APK
        shell: bash
        env:
          INPUT_BASE_URL: ${{ github.event.inputs.base_url }}
          VAR_BASE_URL: ${{ vars.ARIA_MOBILE_BASE_URL }}
          DEFAULT_BASE_URL: https://aria3.corenationactive.com
        run: |
          BASE_URL="${INPUT_BASE_URL:-${VAR_BASE_URL:-$DEFAULT_BASE_URL}}"
          echo "Baking default base URL into APK: ${BASE_URL}"
          flutter build apk --debug \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define="ARIA_DEFAULT_BASE_URL=${BASE_URL}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aria-mobile-debug-apk
          path: apps/aria_mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
