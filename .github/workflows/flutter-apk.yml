name: Flutter debug APK

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Optional API base URL baked into the APK (no trailing slash). Overrides repo variable ARIA_MOBILE_BASE_URL.'
        required: false
        type: string
  push:
    branches:
      - main
      - develop
      - master
    paths:
      - 'apps/aria_mobile/**'
      - '.github/workflows/flutter-apk.yml'

# Building a signed release APK needs keystore secrets; this workflow builds a debug APK for sideloading.
jobs:
  apk:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable

    defaults:
      run:
        working-directory: apps/aria_mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Apply Android manifest (camera permission)
        run: cp android_manifests/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        env:
          INPUT_BASE_URL: ${{ github.event.inputs.base_url }}
          VAR_BASE_URL: ${{ vars.ARIA_MOBILE_BASE_URL }}
        run: |
          BASE_URL="${INPUT_BASE_URL:-$VAR_BASE_URL}"
          if [ -n "${BASE_URL}" ]; then
            echo "Baking default base URL into APK (dart-define)."
            flutter build apk --debug --dart-define="ARIA_DEFAULT_BASE_URL=${BASE_URL}"
          else
            flutter build apk --debug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aria-mobile-debug-apk
          path: apps/aria_mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
